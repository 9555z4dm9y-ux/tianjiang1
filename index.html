<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8fab" />
  <meta name="description" content="甜酱的日常记录：打卡、计划、记账、宝宝成长、出门清单、体重、衣物消耗品" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="甜酱日常" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <title>甜酱日常</title>
  <link rel="stylesheet" href="styles.css?v=29" />
</head>
<body>
  <div id="app">
    <!-- 左侧导航 -->
    <nav class="side-nav">
      <div class="nav-brand">🌸 甜酱日常</div>
      <button class="nav-item active" data-tab="home">
        <span class="nav-icon">🏠</span><span class="nav-label">每日打卡</span>
      </button>
      <button class="nav-item" data-tab="plan">
        <span class="nav-icon">📋</span><span class="nav-label">计划</span>
      </button>
      <button class="nav-item" data-tab="account">
        <span class="nav-icon">💰</span><span class="nav-label">账本</span>
      </button>
      <button class="nav-item" data-tab="growth">
        <span class="nav-icon">🌱</span><span class="nav-label">成长记录</span>
      </button>
      <button class="nav-item" data-tab="more">
        <span class="nav-icon">✨</span><span class="nav-label">更多</span>
      </button>
      <!-- 二级子目录（动态渲染） -->
      <div id="subNav" class="sub-nav"></div>
    </nav>

    <!-- 右侧主区 -->
    <div class="main-wrap">
      <!-- 顶部标题 -->
      <header class="top-bar">
        <h1 id="pageTitle">甜酱日常</h1>
        <div class="top-bar-right">
          <button class="btn-download-app" onclick="downloadApp()" title="下载APP到本地">⬇️ 下载APP</button>
          <div class="date" id="todayDate"></div>
        </div>
      </header>

      <!-- 内容区 -->
      <main id="content"></main>
    </div>
  </div>

  <!-- 弹窗容器 -->
  <div id="modalRoot"></div>

  <script src="app.js?v=29"></script>
  <script>
    // 注册 Service Worker 实现离线访问 + 自动更新
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          // 检测到新 SW 等待激活时，提示用户刷新
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // 新版本已下载，提示刷新
                  showUpdateToast();
                }
              });
            }
          });
          // 每 30 分钟检查一次更新
          setInterval(() => reg.update(), 1800000);
        }).catch(() => {});
        // 监听控制器变更（新 SW 已接管），自动刷新
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
    // 更新提示弹窗
    function showUpdateToast() {
      const t = document.createElement('div');
      t.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;';
      t.innerHTML = '<span>✨ 发现新版本</span><button onclick="window.location.reload()" style="background:#ff6b9d;color:#fff;border:none;padding:6px 16px;border-radius:14px;font-size:13px;cursor:pointer;">立即更新</button>';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 15000);
    }
  </script>
</body>
</html>
